<style>
/* Layout: one narrow column like an exercise book page; light = grünes Heft, dark = Schultafel */
:root{
  --paper:#f8faf3; --card:#ffffff; --ink:#1d2b24; --muted:#5d6d63;
  --line:#dce8dd; --heft:#2f8a4f; --heft-ink:#ffffff; --heft-soft:#e3f1e6;
  --ok:#23854a; --ok-soft:#dcf2e3; --bad:#c9413b; --bad-soft:#fbe3e1;
  --mark:#f3c43b; --mark-soft:#fdf3d2; --border:#cbd8cd;
  --display:"Grandstander","Comic Sans MS","Trebuchet MS",sans-serif;
  --body:"Andika","Trebuchet MS","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14211a; --card:#1c2c23; --ink:#eef4ee; --muted:#a6b8ab;
  --line:#1f3027; --heft:#5cc07d; --heft-ink:#0f1a13; --heft-soft:#21392b;
  --ok:#5cc07d; --ok-soft:#1f3c2a; --bad:#ff7b72; --bad-soft:#41231f;
  --mark:#f3c43b; --mark-soft:#3a3220; --border:#2e4437; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14211a; --card:#1c2c23; --ink:#eef4ee; --muted:#a6b8ab;
  --line:#1f3027; --heft:#5cc07d; --heft-ink:#0f1a13; --heft-soft:#21392b;
  --ok:#5cc07d; --ok-soft:#1f3c2a; --bad:#ff7b72; --bad-soft:#41231f;
  --mark:#f3c43b; --mark-soft:#3a3220; --border:#2e4437; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;
  background-image:repeating-linear-gradient(to bottom,transparent 0 35px,var(--line) 35px 36px);}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.app{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2.1rem}
h2{font-size:1.4rem}
.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
p{margin:0}

/* Home */
.cover{background:var(--heft);color:var(--heft-ink);border-radius:18px 18px 18px 6px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative}
.cover .eyebrow{color:inherit;opacity:.8}
.label{background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;justify-content:space-between}
.label strong{font-family:var(--display);font-size:1.15rem}
.days{font-family:var(--display);font-weight:800;font-size:1.05rem;background:var(--mark);color:#2a2207;border-radius:999px;padding:2px 12px;white-space:nowrap}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:1.05rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px}
.btn-main{background:var(--mark);color:#2a2207;box-shadow:0 3px 0 #c99a12}
.btn-main:active{transform:translateY(2px);box-shadow:0 1px 0 #c99a12}
.btn-soft{background:var(--heft-soft);color:var(--ink)}
.btn-line{background:transparent;border:2px solid var(--border);color:var(--ink)}
.btn-wide{width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile:hover{border-color:var(--heft)}
.tile .ex{font-family:var(--display);font-weight:600;color:var(--heft);font-size:1.05rem}
.tile .name{font-weight:700;line-height:1.3}
.stars{display:flex;gap:3px;align-items:center;font-size:.85rem;color:var(--muted)}
.star{width:18px;height:18px}
.star path{fill:var(--line);stroke:var(--border);stroke-width:1}
.star.on path{fill:var(--mark);stroke:#c99a12}
.section{display:flex;flex-direction:column;gap:12px}
.reset{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px}

/* Intro */
.topbar{display:flex;align-items:center;gap:12px}
.back{width:44px;height:44px;border-radius:12px;border:2px solid var(--border);background:var(--card);font-size:1.3rem;line-height:1;flex:none}
.merke{background:var(--mark-soft);border:2px dashed var(--mark);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.merke h3{font-size:1.1rem}
.merke ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.big-ex{font-family:var(--display);font-weight:600;font-size:1.2rem;color:var(--heft)}

/* Quiz */
.progress{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--heft);border-radius:99px;transition:width .3s}
.qcount{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:2px solid var(--border);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.instr{font-size:.95rem;color:var(--muted);font-weight:700}
.prompt{font-size:1.45rem;line-height:1.45;font-weight:700;overflow-wrap:anywhere}
.prompt small{font-size:.7em;color:var(--muted);font-weight:400}
.inf{color:var(--muted);font-weight:400;font-size:.85em}
.gap{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--heft);padding:0 4px;text-align:center;color:var(--heft)}
.gap.ok{color:var(--ok);border-color:var(--ok)}
.gap.bad{color:var(--bad);border-color:var(--bad)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.opts.long{grid-template-columns:1fr}
.opt{background:var(--paper);border:2px solid var(--border);border-radius:14px;padding:12px 14px;min-height:56px;font-size:1.15rem;font-weight:700;text-align:center}
.opts.long .opt{text-align:left;font-size:1.05rem}
.opt:hover:not(:disabled){border-color:var(--heft)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad){opacity:.55}
.answer-row{display:flex;gap:10px;flex-wrap:wrap}
.answer-row input{flex:1 1 180px;min-width:0;font-size:1.35rem;padding:10px 14px;border-radius:14px;border:2px solid var(--border);background:var(--paper)}
.answer-row input:focus{border-color:var(--heft);outline:none}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.key{width:44px;height:44px;border-radius:10px;border:2px solid var(--border);background:var(--paper);font-weight:700;font-size:1.1rem}
.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.feedback.ok{background:var(--ok-soft)}
.feedback.bad{background:var(--bad-soft)}
.feedback strong{font-family:var(--display);font-size:1.25rem}
.feedback.ok strong{color:var(--ok)}
.feedback.bad strong{color:var(--bad)}
.text-box{background:var(--paper);border-left:4px solid var(--heft);border-radius:4px 12px 12px 4px;padding:14px 16px;font-size:1.05rem;line-height:1.7;max-height:42vh;overflow:auto}
.text-box h3{font-size:1.15rem;margin-bottom:6px}
.text-box p+p{margin-top:8px}

/* Result */
.result-head{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.result-head .score{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.result-head .stars .star{width:40px;height:40px}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.list li{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.list .right{color:var(--ok);font-weight:700}
.list .wrong{color:var(--bad);text-decoration:line-through}
.breakdown li{flex-direction:row;justify-content:space-between;align-items:center;gap:10px}
.pill{border-radius:999px;padding:2px 10px;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.good{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--mark-soft);color:var(--ink)}
.pill.low{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;flex-direction:column;gap:10px}
.textpick{display:flex;flex-direction:column;gap:10px}
.textpick .tile{flex-direction:row;align-items:center;justify-content:space-between}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.feedback{animation:pop .25s ease-out}
</style>

// ---------- Aufgaben-Generatoren ----------
const TOPICS = [
 {id:'em', name:'Einzahl und Mehrzahl', ex:'Maus → Mäuse',
  rule:['Einzahl: <b>ein</b> Ding. Mehrzahl: <b>viele</b>. In der Mehrzahl heißt der Artikel immer <b>die</b>.','Oft kommt ein Umlaut dazu: a → ä, o → ö, u → ü, au → äu.','Manche Wörter bleiben gleich: der Lehrer – die Lehrer.'],
  big:'die Maus – die Mäuse · das Buch – die Bücher',
  gen(){ const [a,s,p]=pick(EM), r=Math.random();
   if(r<.4) return {instr:'Schreibe die Mehrzahl.', prompt:`${a} ${s} → die ___`, type:'input', answer:p, explain:`${a} ${s} – die ${p}`};
   if(r<.65) return {instr:'Schreibe die Einzahl.', prompt:`die ${p} → ${a} ___`, type:'input', answer:s, explain:`die ${p} – ${a} ${s}`};
   const d=[deUml(p),s+'e',s+'en',s+'s',umlautify(s)+'e',umlautify(s)+'er',s+'n'].filter(x=>x!==s);
   return {instr:'Welche Mehrzahl ist richtig?', prompt:`${a} ${s} → die ___`, type:'mc', options:withOpts(p,d), answer:p, explain:`${a} ${s} – die ${p}`}; }},
 {id:'pron', name:'Pronomen', ex:'ich · du · er · sie · es · wir · ihr',
  rule:['Pronomen sind <b>Fürwörter</b>. Sie stehen <b>für</b> ein Nomen.','ich, du, er, sie, es – wir, ihr, sie','der → <b>er</b> · die → <b>sie</b> · das → <b>es</b> · viele → <b>sie</b>'],
  big:'Der Hund bellt. <u>Er</u> hat Hunger.',

     const up = before==='' || /[.!?]$/.test(before); const f=x=>up?cap(x):x;
     return {instr:'Welches Pronomen passt?', prompt:s, type:'mc', options:['ich','du','er','sie','es','wir','ihr'].map(f), answer:f(a), explain:`Richtig ist „${f(a)}“.`, small:true}; }
   const [n,a]=pick(PRON_REPL);
   return {instr:'Welches Pronomen ersetzt das Nomen?', prompt:`<b>${n}</b> → ___`, type:'mc', options:['er','sie','es','wir','ihr'], answer:a, explain:`${n} → ${a}`, small:true}; }},
 {id:'zn', name:'Zusammengesetzte Nomen', ex:'Tisch + Tuch = Tischtuch',

  big:'der Regen + der Schirm = der Regenschirm',
  gen(){ const [a1,w1,a2,w2,ar,res]=pick(ZN), r=Math.random();
   if(r<.45) return {instr:'Setze die Nomen zusammen.', prompt:`${a1} ${w1} + ${a2} ${w2} = ${ar} ___`, type:'input', answer:res, explain:`${ar} ${res} – das zweite Nomen schreibst du klein.`};
   if(r<.75) return {instr:'Welcher Artikel passt?', prompt:`___ ${res}`, type:'mc', options:['der','die','das'], answer:ar, explain:`${a2} ${w2} → ${ar} ${res}. Das letzte Wort bestimmt den Artikel.`};
   return {instr:'Welches Wort ist richtig geschrieben?', prompt:`${w1} + ${w2} = ___`, type:'mc', options:withOpts(res,[w1+w2, w1+' '+w2, res.toLowerCase()]), answer:res, explain:`Man schreibt ${res}: zusammen und nur am Anfang groß.`}; }},
 {id:'vf', name:'Passende Verbformen', ex:'ich gehe · du gehst · er geht',
  rule:['Das Verb ändert seine Endung – je nachdem, <b>wer</b> etwas tut.','ich spiel<b>e</b> · du spiel<b>st</b> · er/sie/es spiel<b>t</b> · wir spiel<b>en</b> · ihr spiel<b>t</b> · sie spiel<b>en</b>','Achtung, manche Verben ändern auch den Vokal: ich lese – du l<b>ie</b>st, ich fahre – du f<b>ä</b>hrst.'],
  big:'ich male · du malst · er malt',
  gen(){ const v = Math.random()<.4 ? pick(Object.keys(IRR)) : pick(REG); const f=conj(v); const [s,i]=pick(SUBJ); const a=f[i];
   const note = IRR[v] && v!=='sein' && v!=='haben' && f[1].slice(0,3)!==v.slice(0,3) ? ` Achtung: ${v} ändert den Vokal (du ${f[1]}, er ${f[2]}).` : '';
   if(Math.random()<.55) return {instr:'Schreibe die passende Verbform.', prompt:`${s} ___ <span class="inf">(${v})</span>`, type:'input', answer:a, explain:`${s.replace(/ <small>.*<\/small>/,'')} ${a}.${note}`};
   return {instr:'Welche Verbform passt?', prompt:`${s} ___ <span class="inf">(${v})</span>`, type:'mc', options:withOpts(a,f), answer:a, explain:`${s.replace(/ <small>.*<\/small>/,'')} ${a}.${note}`}; }},
 {id:'vs', name:'Verben mit Vorsilben', ex:'auf + fahren = auffahren',
  rule:['Eine <b>Vorsilbe</b> vor dem Verb verändert seine Bedeutung.','Vorsilben: auf, ab, an, aus, ein, mit, vor, weg, zu, nach, um, be, er, ver, zer, ent','Vorsilbe und Verb schreibt man <b>zusammen</b> und <b>klein</b>: aufräumen.'],
  big:'ziehen → anziehen, ausziehen, umziehen',
  gen(){ const r=Math.random();
   if(r<.45){ const [s,a,d]=pick(VS_SENT); return {instr:'Welches Verb passt in den Satz?', prompt:s, type:'mc', options:shuffle([a,...d]), answer:a, explain:`${s.replace('___',a)}`}; }
   if(r<.8){ const [p,v]=pick(VS_BUILD); return {instr:'Bilde das neue Verb.', prompt:`${p} + ${v} = ___`, type:'input', answer:p+v, explain:`${p} + ${v} = ${p+v} (zusammen und klein)`}; }
   const pair=pick(VS_OPP), flip=Math.random()<.5, w=flip?pair[1]:pair[0], a=flip?pair[0]:pair[1];
   return {instr:'Was ist das Gegenteil?', prompt:`<b>${w}</b> ↔ ___`, type:'mc', options:withOpts(a, VS_OPP.flat().filter(x=>x!==w)), answer:a, explain:`${w} ↔ ${a}`}; }},
 {id:'wf', name:'Wortfelder', ex:'gehen: laufen, rennen …',
  rule:['Ein <b>Wortfeld</b> sind Wörter, die etwas Ähnliches bedeuten.','Wortfeld <b>gehen</b>: laufen, rennen, schleichen, hüpfen …','Wortfeld <b>sagen</b>: rufen, flüstern, fragen … · Wortfeld <b>sehen</b>: schauen, gucken, beobachten … · Wortfeld <b>essen</b>: kauen, naschen, knabbern …'],
  big:'Statt immer „gehen“: schleichen, rennen, humpeln',
  gen(){ const fields=Object.keys(WF), r=Math.random();
   if(r<.4){ const f=pick(fields), w=pick(WF[f]); return {instr:'Zu welchem Wortfeld gehört das Verb?', prompt:`<b>${w}</b> → Wortfeld ___`, type:'mc', options:fields, answer:f, explain:`„${w}“ gehört zum Wortfeld „${f}“.`}; }
   if(r<.7){ const f=pick(fields), other=pick(fields.filter(x=>x!==f)), odd=pick(WF[other]);
     return {instr:`Welches Verb gehört NICHT zum Wortfeld „${f}“?`, prompt:`Wortfeld <b>${f}</b>: ___`, type:'mc', options:shuffle([odd,...shuffle(WF[f]).slice(0,3)]), answer:odd, explain:`„${odd}“ gehört zum Wortfeld „${other}“.`}; }
   const [s,a,d]=pick(WF_SENT); return {instr:'Welches Verb passt am besten?', prompt:s, type:'mc', options:shuffle([a,...d]), answer:a, explain:s.replace('___',a)}; }},
 {id:'vn', name:'Verben und Nomen zusammensetzen', ex:'lesen + Buch = Lesebuch',
  rule:['Vom Verb nimmst du nur den <b>Wortstamm</b>: lesen → les(e), spielen → spiel.','Dann kommt das Nomen dazu: spiel + Platz = <b>Spielplatz</b>.','Das neue Wort ist ein Nomen: Anfang groß, Artikel vom letzten Wort.'],
  big:'schwimmen + das Bad = das Schwimmbad',

   if(r<.75) return {instr:'Aus welchem Verb ist das Wort gemacht?', prompt:`<b>${res}</b> ← ___ + ${n}`, type:'mc', options:withOpts(v, VN.map(x=>x[0])), answer:v, explain:`${res} = ${v} + ${n}`};
   return {instr:'Welches Wort ist richtig geschrieben?', prompt:`${v} + ${n} = ___`, type:'mc', options:withOpts(res,[cap(v)+n.toLowerCase(), res.toLowerCase(), stem+n]), answer:res, explain:`Richtig: ${res} – Wortstamm + Nomen, zusammen, nur am Anfang groß.`}; }}
];
const byId = id => TOPICS.find(t=>t.id===id);

// ---------- Speicher ----------
const KEY='deutsch3-fortschritt';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function save(p){ try{ localStorage.setItem(KEY, JSON.stringify(p)); }catch(e){} }
let progress = load();
const starsFor = pct => pct>=90?3:pct>=70?2:pct>=50?1:0;
const STAR = on => `<svg class="star${on?' on':''}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>`;
const starRow = n => [0,1,2].map(i=>STAR(i<n)).join('');

// ---------- Ablauf ----------
const TEST = new Date(2026,9,13); // Dienstag, 13.10.2026
let S = {};

function makeRound(topic, n=10){
  const out=[], seen=new Set(); let tries=0;
  while(out.length<n && tries<200){ tries++; const q=topic.gen(); const k=q.prompt+q.instr; if(seen.has(k)) continue; seen.add(k); q.topic=topic.id; out.push(q); }
  return out;
}
function startTopic(id){ const t=byId(id); S={mode:'topic', id, title:t.name, qs:makeRound(t), i:0, res:[]}; renderQuiz(); }
function startProbe(){ const qs=[]; TOPICS.forEach(t=>qs.push(...makeRound(t,2))); S={mode:'probe', id:'probe', title:'Probearbeit', qs, i:0, res:[]}; renderQuiz(); }
function startText(tid){ const t=TEXTS.find(x=>x.id===tid);
  const qs=t.qs.map(([q,a,d])=>({instr:'Lies den Text und beantworte die Frage.', prompt:q, type:'mc', options:shuffle([a,...d]), answer:a, explain:`Richtig: ${a}`, text:t, long:true, topic:'lesen'}));
  S={mode:'lesen', id:'lesen-'+tid, title:t.title, qs, i:0, res:[]}; renderQuiz(); }
function retryMistakes(){ const wrong=S.res.filter(r=>!r.ok).map(r=>({...r.q, options:r.q.options?shuffle(r.q.options):undefined}));
  S={mode:'retry', id:null, title:'Fehler üben', back:S, qs:shuffle(wrong), i:0, res:[]}; renderQuiz(); }

// ---------- Ansichten ----------
const app = $('#app');
function daysLeft(){ const now=new Date(); const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()); return Math.round((TEST-t0)/864e5); }

function renderHome(){
  const d=daysLeft();
  const dl = d>1?`noch ${d} Tage`:d===1?'morgen!':d===0?'heute!':'';
  const probe=progress.probe;
  app.innerHTML = `
  <section class="cover">
    <span class="eyebrow">Klasse 3 · Deutsch</span>
    <h1>Deutsch-Trainer</h1>
    ${d>=0?`<div class="label"><div><div class="eyebrow">Deutscharbeit</div><strong>Dienstag, 13. Oktober</strong></div><span class="days">${dl}</span></div>`:''}
    <p style="opacity:.9">Grünes Heft 1, Seite 8–25</p>
  </section>
  <button class="btn btn-main btn-wide" data-act="probe">Probearbeit schreiben · 14 Aufgaben</button>
  ${probe?`<p class="muted" style="margin-top:-12px;text-align:center">Letzte Probearbeit: ${probe.last} von ${probe.total} richtig</p>`:''}
  <section class="section">
    <h2>Themen üben</h2>
    <div class="grid">
      ${TOPICS.map(t=>{const p=progress[t.id]; return `<button class="tile" data-act="intro" data-id="${t.id}">
        <span class="ex">${t.ex}</span><span class="name">${t.name}</span>
        <span class="stars">${starRow(p?starsFor(p.best):0)}${p?`<span style="margin-left:6px">${p.plays}× geübt</span>`:''}</span></button>`;}).join('')}
      <button class="tile" data-act="lesen"><span class="ex">Lesen &amp; verstehen</span><span class="name">Lesetexte mit Fragen</span>
        <span class="stars">${TEXTS.filter(t=>progress['lesen-'+t.id]).length} von ${TEXTS.length} Texten gelesen</span></button>
    </div>
  </section>
  <div class="reset" id="reset"><button class="link" data-act="reset">Fortschritt löschen</button></div>`;
}

function renderIntro(id){
  const t=byId(id);
  app.innerHTML = `
  <div class="topbar"><button class="back" data-act="home" aria-label="Zurück">←</button><h2>${t.name}</h2></div>
  <div class="merke"><h3>Merke</h3><ul>${t.rule.map(r=>`<li>${r}</li>`).join('')}</ul></div>
  <p class="big-ex">${t.big}</p>
  <button class="btn btn-main btn-wide" data-act="start" data-id="${id}">Los geht's · 10 Aufgaben</button>`;
}

function renderLesen(){
  app.innerHTML = `
  <div class="topbar"><button class="back" data-act="home" aria-label="Zurück">←</button><h2>Lesen &amp; verstehen</h2></div>
  <div class="merke"><h3>So geht's</h3><ul><li>Lies den Text in Ruhe – am besten <b>laut</b>.</li><li>Lies ihn ein zweites Mal.</li><li>Bei jeder Frage: Suche die Antwort im Text!</li></ul></div>
  <div class="textpick">${TEXTS.map(t=>{const p=progress['lesen-'+t.id]; return `<button class="tile" data-act="text" data-id="${t.id}"><span class="name">${t.title}</span><span class="stars">${starRow(p?starsFor(p.best):0)}</span></button>`;}).join('')}</div>`;
}

function renderQuiz(){
  const q=S.qs[S.i], n=S.qs.length;
  const gapped = q.prompt.replace('___','<span class="gap" id="gap">&nbsp;</span>');
  const sectionName = S.mode==='probe' ? `<div class="instr" style="color:var(--heft)">${byId(q.topic).name}</div>` : '';
  app.innerHTML = `
  <div class="topbar"><button class="back" data-act="home" aria-label="Abbrechen">×</button>
    <div class="progress"><div class="qcount">${S.title} · Aufgabe ${S.i+1} von ${n}</div><div class="bar"><i style="width:${S.i/n*100}%"></i></div></div></div>
  ${q.text?`<div class="text-box"><h3>${q.text.title}</h3>${q.text.body.map(p=>`<p>${p}</p>`).join('')}</div>`:''}
  <section class="card">
    ${sectionName}
    <div class="instr">${q.instr}</div>
    <div class="prompt">${gapped}</div>
    ${q.type==='mc' ? `<div class="opts${q.long?' long':''}">${q.options.map(o=>`<button class="opt" data-act="opt" data-v="${o}">${o}</button>`).join('')}</div>`
     : `<form class="answer-row" id="f"><input id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Deine Antwort" placeholder="Antwort …"><button class="btn btn-soft" type="submit">Prüfen</button></form>
        <div class="keys">${['ä','ö','ü','ß','Ä','Ö','Ü'].map(k=>`<button class="key" type="button" data-act="key" data-k="${k}">${k}</button>`).join('')}</div>`}
    <div id="fb"></div>
  </section>`;
  const inp=$('#ans'); if(inp) inp.focus();
  S.done=false;
}

const PRAISE=['Super!','Richtig!','Klasse!','Genau!','Prima!','Toll gemacht!'];
function answer(given){
  if(S.done) return; const q=S.qs[S.i];
  const g=given.trim().replace(/\s+/g,' ');
  if(q.type==='input' && !g){ $('#ans').focus(); return; }
  S.done=true;
  const ok = g===q.answer;
  const caseOnly = !ok && g.toLowerCase()===q.answer.toLowerCase();
  S.res.push({q, ok, given:g});
  const gap=$('#gap'); if(gap){ gap.textContent=q.answer; gap.classList.add(ok?'ok':'bad'); }
  document.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; if(b.dataset.v===q.answer) b.classList.add('ok'); else if(b.dataset.v===g) b.classList.add('bad'); });
  const inp=$('#ans'); if(inp){ inp.disabled=true; inp.style.borderColor= ok?'var(--ok)':'var(--bad)'; document.querySelectorAll('.answer-row button,.key').forEach(b=>b.disabled=true); }
  const last=S.i===S.qs.length-1;
  $('#fb').innerHTML = `<div class="feedback ${ok?'ok':'bad'}">
     <strong>${ok?pick(PRAISE):caseOnly?'Fast!':'Leider nicht.'}</strong>
     ${caseOnly?'<span>Achte auf die Groß- und Kleinschreibung.</span>':''}
     ${ok?'':`<span>Richtig ist: <b>${q.answer}</b></span>`}
     <span class="muted">${q.explain}</span></div>
     <button class="btn btn-main btn-wide" data-act="next" id="next" style="margin-top:12px">${last?'Ergebnis ansehen':'Weiter'}</button>`;
  $('#next').focus();
}
function next(){ if(S.i<S.qs.length-1){ S.i++; renderQuiz(); } else renderResult(); }

function renderResult(){
  const n=S.qs.length, c=S.res.filter(r=>r.ok).length, pct=Math.round(c/n*100), st=starsFor(pct);
  if(S.id){ const p=progress[S.id]||{best:0,plays:0}; p.best=Math.max(p.best,pct); p.plays++; if(S.mode==='probe'){p.last=c;p.total=n;} progress[S.id]=p; save(progress); }
  const wrong=S.res.filter(r=>!r.ok);
  const msg = pct===100?'Alles richtig – du bist bereit!':pct>=80?'Sehr gut gemacht!':pct>=60?'Gut! Übe die Fehler noch einmal.':'Weiter üben – du schaffst das!';
  let breakdown='';
  if(S.mode==='probe'){
    breakdown = `<section class="section"><h2>Deine Themen</h2><ul class="list breakdown">${TOPICS.map(t=>{const rs=S.res.filter(r=>r.q.topic===t.id), k=rs.filter(r=>r.ok).length; const cls=k===rs.length?'good':k>0?'mid':'low';
      return `<li><span>${t.name}</span><span class="pill ${cls}">${k} / ${rs.length}</span></li>`;}).join('')}</ul></section>`;
  }
  app.innerHTML = `
  <section class="card result-head">
    <span class="eyebrow">${S.title}</span>
    <div class="stars">${starRow(st)}</div>
    <div class="score">${c} / ${n}</div>
    <p>${msg}</p>
  </section>
  ${breakdown}
  ${wrong.length?`<section class="section"><h2>Das übst du noch</h2><ul class="list">${wrong.map(r=>`<li><span class="muted">${r.q.prompt.replace('___','…')}</span><span>${r.given?`<span class="wrong">${r.given}</span> → `:''}<span class="right">${r.q.answer}</span></span></li>`).join('')}</ul></section>`:''}
  <div class="actions">
    ${wrong.length?`<button class="btn btn-main" data-act="retry">Fehler nochmal üben (${wrong.length})</button>`:''}
    ${S.mode==='topic'?`<button class="btn btn-soft" data-act="start" data-id="${S.id}">Neue Aufgaben</button>`:''}
    ${S.mode==='probe'?`<button class="btn btn-soft" data-act="probe">Neue Probearbeit</button>`:''}
    <button class="btn btn-line" data-act="home">Zur Übersicht</button>
  </div>`;
}

// ---------- Events ----------
app.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act, id=b.dataset.id;
  if(a==='home'){ renderHome(); scrollTo(0,0); }
  else if(a==='intro'){ renderIntro(id); scrollTo(0,0); }
  else if(a==='start') startTopic(id);
  else if(a==='probe') startProbe();
  else if(a==='lesen') renderLesen();
  else if(a==='text') startText(id);
  else if(a==='opt') answer(b.dataset.v);
  else if(a==='next') next();
  else if(a==='retry') retryMistakes();
  else if(a==='key'){ const i=$('#ans'); const s=i.selectionStart??i.value.length, en=i.selectionEnd??s; i.setRangeText(b.dataset.k,s,en,'end'); i.focus(); }
  else if(a==='reset'){ $('#reset').innerHTML='<span>Wirklich alles löschen?</span><button class="btn btn-line" data-act="reset-yes" style="min-height:40px;padding:6px 14px">Ja, löschen</button><button class="link" data-act="home">Abbrechen</button>'; }
  else if(a==='reset-yes'){ progress={}; save(progress); renderHome(); }
});
app.addEventListener('submit', e=>{ e.preventDefault(); answer($('#ans').value); });
renderHome();
</script>

<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
